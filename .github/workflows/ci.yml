name: MailForge CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mailforge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # packageManager in root package.json pins pnpm 10.34.7.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install reproducibly
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r --if-present build
      - name: Typecheck
        run: pnpm -r --if-present typecheck
      - name: Test
        run: pnpm -r --if-present test
      - name: Check concurrent rendering
        run: node --test tests/quality/ConcurrentRendering.test.mjs
      - name: Lint
        run: pnpm lint
      - name: Generate default email previews
        run: node scripts/generate-all-template-previews.mjs
      - name: Check whitespace
        run: git diff --check
